name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへの連続 push では古い run を自動キャンセル。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p device-hub -p devhub-obs
      - name: Build Logitech hardware diagnostic
        run: cargo build --release --locked -p devhub-hid --example logitech_check
      - name: Stage Windows distribution
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: device-hub-windows-x64
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: logitech-hardware-diagnostic-windows-x64
          path: target/release/examples/logitech_check.exe
          if-no-files-found: error
